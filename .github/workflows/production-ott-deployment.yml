name: Production OTT Deployment

on:
  push:
    branches:
      - main
      - post_7k

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Downcase Repository Name for Docker Tag
        run: echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_NAME }}/ott-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Admin Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-admin
          file: ./frontend-admin/dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_NAME }}/ott-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-server:
    name: SSH & Execute Deployment on Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT }}
          script: |
            cd /d C:\ott-platform

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --no-deps backend worker admin
            docker image prune -f
