version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# OTT Platform — PRODUCTION Docker Compose
#
# ⚠️  THIS FILE DOES NOT BUILD ANYTHING.
#     Images are pulled from GitHub Container Registry (GHCR).
#     Source code is NOT required on this server.
#
# How to use on the production server:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Required on the server (same directory as this file):
#   - .env.production   → all secrets (never commit this file)
#   - nginx/nginx.conf  → nginx configuration
# ─────────────────────────────────────────────────────────────────────────────

# ─── Global log rotation (50 MB max per service) ─────────────────────────────
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ── Nginx reverse proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: edtech-nginx

    ports:
      - "8080:80"

    volumes:
      # nginx.conf must be present on the server in ./nginx/nginx.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_hls_cache:/var/cache/nginx/hls
      - nginx_image_cache:/var/cache/nginx/images
      - nginx_live_hls_cache:/var/cache/nginx/live_hls

    depends_on:
      - admin
      - backend
      # - mediamtx

    deploy:
      resources:
        limits:
          cpus: '2.5'
          memory: 50g

    restart: unless-stopped
    logging: *default-logging

  # ── Admin frontend (pre-built image from GHCR) ─────────────────────────────
  admin:
    # ✅ No build: — image pulled from GHCR by GitHub Actions CI
    image: ghcr.io/vishhh2125/sankalp-edtech-production/ott-admin:latest
    container_name: edtech-admin

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

    restart: unless-stopped
    logging: *default-logging

  # ── Backend API (pre-built image from GHCR) ────────────────────────────────
  backend:
    # ✅ No build: — image pulled from GHCR by GitHub Actions CI
    image: ghcr.io/vishhh2125/sankalp-edtech-production/ott-backend:latest
    container_name: edtech-backend

    command:
      [
        "sh", "-c",
        "npx prisma migrate deploy && npx prisma generate && node server.js"
      ]

    # ✅ No source volume mount — code is baked into the image
    # prisma schema is baked into the image at /app/prisma
    # MOUNTING server.js locally to fix the missing module error in the GHCR image
    volumes:
      - ./backend/server.js:/app/server.js

    ports:
      - "3000:3000"

    # All secrets live in .env.production on the server (never committed to git)
    env_file:
      - .env.production

    environment:
      - PORT=3000
      - NODE_ENV=production
      - MANUAL_CLUSTER=true
      - CLUSTER_WORKERS=4
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false

    depends_on:
      - postgres
      - redis
      - minio

    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4g

    restart: unless-stopped
    logging: *default-logging

  # ── Transcode worker (reuses the backend image — no separate build) ─────────
  worker:
    # ✅ Same image as backend — no second build needed
    image: ghcr.io/vishhh2125/sankalp-edtech-production/ott-backend:latest
    container_name: edtech-worker

    command: ["node", "workers/transcode.worker.js"]

    # All secrets live in .env.production on the server
    env_file:
      - .env.production

    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false

    depends_on:
      - postgres
      - redis
      - minio

    # FFmpeg is CPU-heavy — capped at 3 cores for 2 concurrent jobs
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 8g

    restart: unless-stopped
    logging: *default-logging

  # ── PostgreSQL — public image, unchanged ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: edtech-postgres

    ports:
      - "5432:5432"

    # Credentials read from .env.production
    env_file:
      - .env.production

    volumes:
      - pg_data:/var/lib/postgresql/data

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 4g

    restart: unless-stopped
    logging: *default-logging

  # ── Redis — public image, unchanged ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: edtech-redis

    command: redis-server --maxmemory 8gb --maxmemory-policy noeviction

    volumes:
      - redis_data:/data

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 9g

    restart: unless-stopped
    logging: *default-logging

  # ── MinIO object storage — public image, unchanged ────────────────────────
  minio:
    image: minio/minio:latest
    container_name: edtech-minio

    command: server /data --console-address ':9001'

    ports:
      - "9000:9000"
      - "9001:9001"

    # Credentials read from .env.production
    env_file:
      - .env.production

    volumes:
      - minio_data:/data

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8g

    restart: unless-stopped
    logging: *default-logging
  # ── Prisma Studio — DB browser (uses the backend image from GHCR) ──────────
  prisma-studio:
    # ✅ Reuses the backend image — no separate build needed
    image: ghcr.io/vishhh2125/sankalp-edtech-production/ott-backend:latest
    container_name: edtech-prisma-studio

    command: >
      sh -c "npx prisma generate && npx prisma studio --port 5555 --browser none --hostname 0.0.0.0"

    ports:
      - "5555:5555"

    env_file:
      - .env.production

    depends_on:
      - postgres

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1g

    restart: unless-stopped
    logging: *default-logging

volumes:
  pg_data:
  redis_data:
  minio_data:
  nginx_hls_cache:
  nginx_image_cache:
  nginx_live_hls_cache:
